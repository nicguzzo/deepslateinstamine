plugins {
    id 'com.github.johnrengelman.shadow'
    id "me.shedaniel.unified-publishing" version "0.1.+"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_version"
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "architectury_version", rootProject.architectury_version    
    inputs.property "neoforge_loaderVersion", rootProject.neoforge_loaderVersion
    inputs.property "java_version", rootProject.java_version
    neoforge_loaderVersion

    filesMatching("META-INF/neoforge.mods.toml") {
        expand (
            "version": project.version,
            "minecraft_version": rootProject.minecraft_version,
            "architectury_version": rootProject.architectury_version,
            "neoforge": rootProject.neoforge,
            "neoforge_loaderVersion": rootProject.neoforge_loaderVersion,
        )
    }
    
    filesMatching("deepslateinstamine.mixins.json") {
        expand "java_version": rootProject.java_version
    }
}
repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}
shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
    //archiveBaseName = project.name + "_neoforge"
}

remapJar {
    input.set shadowJar.archiveFile
}


unifiedPublishing {
    project {
        gameVersions = ["${rootProject.minecraft_version}"]
        gameLoaders = ["neoforge"]
        displayName= "Deepslate Instamine ${rootProject.mod_version} - ${rootProject.release_type} - forge - ${rootProject.minecraft_version}"
        version = "${rootProject.mod_version}_${rootProject.release_type}_forge_${rootProject.minecraft_version}"
        releaseType = "${rootProject.release_type}"
        var chlog= System.getenv("DINSTAMINE_CHANGELOG")
        if (chlog != null) {
           changelog= chlog
        }
        mainPublication tasks.remapJar
        relations {                    
            depends {
                curseforge = "architectury-api" // Optional, project slug
                modrinth = "lhGA9TYQ" // Optional, project slug or id
            }
            //depends {
                //curseforge = "cloth-config" // Optional, project slug
                //modrinth = "9s6osm5g" // Optional, project slug or id
            //}
            includes {} // Mark as an included dependency
            optional {
            } // Mark as an optional dependency
            conflicts {} // Mark as a conflicted dependency
        }

        var cfToken = System.getenv("CF_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = cfToken
                id = "534489" // Required, must be a string, ID of CurseForge project
            }
        }

        var mrToken = System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                //displayName= "Deepslate Instamine"
                displayName= "Deepslate Instamine v${rootProject.mod_version} ${rootProject.release_type}"
                token = mrToken
                id = "g7kBNY9K" // Required, must be a string, ID of Modrinth project
            }
        }
    }
}